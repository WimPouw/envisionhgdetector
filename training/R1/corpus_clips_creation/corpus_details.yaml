num_workers: 4 # num of workers for parallel processing. adjust based on your system capabilities.

defaults:
  # output_directory: C:/Users/User/Desktop/zipped~/CorpusClips/
  output_directory: C:/Users/User/Desktop/zipped~/CorpusClips_test/
  gesture_label: Gesture
  gesture_output_directory: GestureClips
  no_gesture_label: NoGesture
  no_gesture_output_directory: NoGestureClips
  move_label: Move
  move_output_directory: MoveClips
  clips_info_directory: ClipsInfo/
  decreasing_factor: 0.9 # Factor to decrease clip duration for each subsequent attempt when trying to find valid clips
  
corpora:
  - name: TedM3D
    directory: C:\Users\User\Desktop\zipped~\stripped_corpora\M3D_TED\Processed
    module: corpora.tedm3d.TedM3D
    enabled: false

  - name: Ecolang
    directory: C:\Users\User\Desktop\zipped~\stripped_corpora\ECOLANG\trainingraw
    module: corpora.ecolang.Ecolang
    enabled: true

  - name: SAGA
    directory: C:\Users\User\Desktop\zipped~\stripped_corpora\SAGA
    module: corpora.saga.Saga
    enabled: false

  - name: SAGAplus
    directory: C:\Users\User\Desktop\zipped~\stripped_corpora\SAGA+
    module: corpora.saga_plus.SagaPlus
    enabled: false
    
  - name: Multisimo
    directory: C:\Users\User\Desktop\zipped~\stripped_corpora\Multisimo\videos_annotations
    module: corpora.multisimo.Multisimo
    enabled: false

  - name: GESRES
    directory: C:\Users\User\Desktop\zipped~\stripped_corpora\GESRes
    module: corpora.gesres.GesRes
    enabled: false

  - name: ZHUBO
    directory: C:\Users\User\Desktop\zipped~\stripped_corpora\Zhubo\zhubo_split_9
    module: corpora.zhubo.Zhubo
    enabled: false